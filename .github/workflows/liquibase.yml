name: DB Pipeline

on:
  push:
    branches: [ main ]

jobs:
  # --- DEV STAGE: Uses a fresh, temporary cloud database ---
  deploy-dev:
    name: Test in Dev Container
    runs-on: ubuntu-latest
    environment: DEV  # 👈 1. Connects this job to your GitHub Dev Environment settings
    
    # This automatically spawns a private Postgres instance inside GitHub for this job
    services:
      postgres-dev:
        image: postgres:15
        env:
          POSTGRES_DB: dev_db
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Liquibase on Temp Dev DB
        uses: liquibase-github-actions/update@v4.25.0
        with:
          changelogFile: 'db/changelog.yml'
          # CHANGED: 'localhost' updated to 'postgres-dev'
          #url: 'jdbc:postgresql://postgres-dev:5432/dev_db' 
          #username: 'dev_user'
          #password: 'dev_password'
          #searchPath: 'db' # 👈 ADD THIS LINE HERE
          url: ${{ secrets.DB_URL }}        # 👈 2. Dynamically pulls from Dev Secrets
          username: ${{ secrets.DB_USERNAME }}  # 👈 3. Dynamically pulls from Dev Secrets
          password: ${{ secrets.DB_PASSWORD }}  # 👈 4. Dynamically pulls from Dev Secrets


  # --- QA STAGE: Runs only if the Dev container test succeeds ---
  deploy-qa:
    name: Deploy to AWS Aurora QA
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: QA
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Liquibase QA Update
        uses: liquibase-github-actions/update@v4.25.0
        with:
          changelogFile: 'db/changelog.xml'
          url: ${{ secrets.DB_URL }}
          username: ${{ secrets.DB_USERNAME }}
          password: ${{ secrets.DB_PASSWORD }}
