name: Secure Database Release Pipeline

on:
  # Triggers the pipeline when you manually click "Run workflow"
  workflow_dispatch:

jobs:
  # --- STAGE 1: DEV SANDBOX TEST ---
  deploy-dev:
    name: Test in Dev Container
    runs-on: ubuntu-latest
    environment: DEV
    
    services:
      postgres-dev:
        image: postgres:15
        env:
          POSTGRES_DB: dev_db
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Liquibase on Temp Dev DB
        uses: liquibase-github-actions/update@v4.25.0
        with:
          changelogFile: 'db/changelog.yml'
          url: ${{ secrets.DB_URL }}
          username: ${{ secrets.DB_USERNAME }}
          password: ${{ secrets.DB_PASSWORD }}

  # --- STAGE 2: QA DEPLOYMENT (Blocked if DEV Fails) ---
  deploy-qa:
    name: Deploy to AWS Aurora QA
    runs-on: ubuntu-latest
    needs: deploy-dev    # 👈 CRUCIAL: Blocks QA from executing unless DEV finishes Green
    environment: QA      # 👈 Triggers the manual approval setting on GitHub
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Liquibase QA Update
        uses: liquibase-github-actions/update@v4.25.0
        with:
          changelogFile: 'db/changelog.yml'
          url: ${{ secrets.DB_URL }}
          username: ${{ secrets.DB_USERNAME }}
          password: ${{ secrets.DB_PASSWORD }}
